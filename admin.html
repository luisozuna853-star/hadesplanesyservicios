<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerías · Hades Photo Studio</title>
<script src="supabase_config.js"></script>
<style>
*{box-sizing:border-box}
body{font:15px/1.5 Inter,system-ui,sans-serif;margin:0;background:#f6f6f4;color:#111}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;margin:0 0 2px}
h2{font-size:15px;margin:0 0 10px}
.small{color:#666;font-size:13px;margin:0 0 12px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:#444;margin:10px 0 4px}
input[type=text],input[type=date],input[type=email],input[type=password]{width:100%;padding:9px 10px;border:1px solid #d4d4d4;border-radius:7px;font:inherit;background:#fff}
button{font:600 13px Inter;border:1px solid #d4d4d4;background:#fff;border-radius:7px;padding:8px 13px;cursor:pointer}
button.primary{background:#111;color:#fff;border-color:#111}
button.danger{color:#b00020;border-color:#f0c4c9}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>div{flex:1 1 180px}
.gal{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #eee;padding:12px 0;flex-wrap:wrap}
.gal:first-child{border-top:0}
.muted{color:#777;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:4/5;background:#eee;border-radius:6px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .acts{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:space-between;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.thumb .acts button{font-size:11px;padding:3px 6px;background:#fff}
.cover-tag{position:absolute;top:4px;left:4px;background:#f5c400;font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px}
#msg{font-size:13px;margin-top:10px;min-height:18px;color:#333}
.hidden{display:none!important}
</style></head><body><main>

<div id="login" class="card hidden" style="max-width:380px;margin:40px auto">
  <h1>Entrar</h1>
  <p class="small">Solo el administrador puede editar las galerías.</p>
  <label for="lEmail">Correo</label><input type="email" id="lEmail" autocomplete="username">
  <label for="lPass">Contraseña</label><input type="password" id="lPass" autocomplete="current-password">
  <div style="margin-top:14px"><button class="primary" id="btnLogin">Entrar</button></div>
  <div id="loginMsg" class="muted" style="margin-top:10px"></div>
</div>

<div id="app" class="hidden">
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px">
    <div><h1>Galerías</h1><p class="small" style="margin:0">Crea, edita y elimina galerías. Los cambios se publican al instante.</p></div>
    <button id="btnLogout">Salir</button>
  </div>

  <div class="card">
    <h2>Nueva galería</h2>
    <div class="row">
      <div><label for="gTitulo">Nombre</label><input type="text" id="gTitulo" placeholder="Ej. XV de Ana Lucía"></div>
      <div><label for="gFecha">Fecha (opcional)</label><input type="date" id="gFecha"></div>
      <div style="flex:0 0 auto"><button class="primary" id="btnNueva">Crear</button></div>
    </div>
  </div>

  <div class="card">
    <h2>Galerías</h2>
    <div id="lista"><p class="muted">Cargando…</p></div>
  </div>

  <div class="card hidden" id="editor">
    <div class="row" style="justify-content:space-between;align-items:end">
      <div style="flex:1 1 260px"><label for="eTitulo">Nombre</label><input type="text" id="eTitulo"></div>
      <div style="flex:0 0 180px"><label for="eFecha">Fecha</label><input type="date" id="eFecha"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div><label>Portada</label><input type="file" id="ePortada" accept="image/*"></div>
      <div><label>Subir fotos</label><input type="file" id="ePhotos" accept="image/*" multiple></div>
    </div>
    <p class="small" style="margin-top:8px">Las fotos se marcan con HADES PHOTO automáticamente.</p>
    <div id="fotos" class="grid"></div>
    <div style="margin-top:14px" class="row">
      <button class="danger" id="btnDelGal">Eliminar galería</button>
      <button id="btnClose">Cerrar</button>
    </div>
  </div>

  <div id="msg"></div>
</div>

<script>
(function(){
  var U=window.SB.url, K=window.SB.key, BUCKET=window.SB.bucket;
  var token=null, current=null, galerias=[];
  var $=function(id){return document.getElementById(id)};
  function say(t){$('msg').textContent=t;}
  function pubUrl(path){return U+'/storage/v1/object/public/'+BUCKET+'/'+path;}
  function slug(t){return (t||'g').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'g';}

  function headers(extra){
    var h={apikey:K,Authorization:'Bearer '+(token||K)};
    if(extra) for(var k in extra) h[k]=extra[k];
    return h;
  }
  function api(method,path,body,extra){
    var opt={method:method,headers:headers(Object.assign({'Content-Type':'application/json'},extra||{}))};
    if(body!==undefined) opt.body=JSON.stringify(body);
    return fetch(U+'/rest/v1/'+path,opt).then(function(r){
      if(!r.ok) return r.text().then(function(t){throw new Error(method+' '+path+': '+r.status+' '+t)});
      return r.status===204?null:r.json();
    });
  }

  /* login */
  $('btnLogin').onclick=function(){
    var email=$('lEmail').value.trim(), pass=$('lPass').value;
    $('loginMsg').textContent='Entrando…';
    fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
      .then(function(x){
        if(!x.ok||!x.j.access_token){ $('loginMsg').textContent='Correo o contraseña incorrectos.'; return; }
        token=x.j.access_token; sessionStorage.setItem('sb-token',token); sessionStorage.setItem('sb-exp',String(Date.now()+ (x.j.expires_in||3600)*1000));
        showApp();
      }).catch(function(e){ $('loginMsg').textContent='No se pudo entrar: '+e.message; });
  };
  $('btnLogout').onclick=function(){ token=null; sessionStorage.clear(); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); };
  $('lPass').addEventListener('keydown',function(e){ if(e.key==='Enter') $('btnLogin').click(); });

  function showApp(){
    $('login').classList.add('hidden'); $('app').classList.remove('hidden'); loadList();
  }
  // resume a session that is still valid
  var saved=sessionStorage.getItem('sb-token'), exp=parseInt(sessionStorage.getItem('sb-exp')||'0',10);
  if(saved && exp>Date.now()){ token=saved; showApp(); } else { $('login').classList.remove('hidden'); }

  /* list */
  function loadList(){
    return api('GET','galerias?select=id,titulo,fecha,portada_path,fotos(id)&order=fecha.desc.nullslast,created_at.desc').then(function(rows){
      galerias=rows; renderList();
    }).catch(function(e){ say('Error al cargar: '+e.message); });
  }
  function renderList(){
    var box=$('lista'); box.innerHTML='';
    if(!galerias.length){ box.innerHTML='<p class="muted">Todavía no hay galerías.</p>'; return; }
    galerias.forEach(function(g){
      var row=document.createElement('div'); row.className='gal';
      var info=document.createElement('div');
      var b=document.createElement('b'); b.textContent=g.titulo;
      var m=document.createElement('div'); m.className='muted';
      m.textContent=(g.fecha?g.fecha+' · ':'')+((g.fotos||[]).length)+' fotos';
      info.appendChild(b); info.appendChild(m);
      var btn=document.createElement('button'); btn.textContent='Editar'; btn.onclick=function(){ openEditor(g.id); };
      row.appendChild(info); row.appendChild(btn); box.appendChild(row);
    });
  }

  /* create */
  $('btnNueva').onclick=function(){
    var t=$('gTitulo').value.trim(); if(!t){ say('Escribe el nombre de la galería.'); return; }
    var body={titulo:t}; if($('gFecha').value) body.fecha=$('gFecha').value;
    api('POST','galerias',body,{Prefer:'return=representation'}).then(function(rows){
      $('gTitulo').value=''; $('gFecha').value=''; say('Galería creada.');
      return loadList().then(function(){ openEditor(rows[0].id); });
    }).catch(function(e){ say('No se pudo crear: '+e.message); });
  };

  /* editor */
  function openEditor(id){
    current=id; $('editor').classList.remove('hidden');
    return api('GET','galerias?id=eq.'+id+'&select=id,titulo,fecha,portada_path,fotos(id,path,orden)').then(function(rows){
      var g=rows[0]; $('eTitulo').value=g.titulo; $('eFecha').value=g.fecha||'';
      g.fotos.sort(function(a,b){return (a.orden||0)-(b.orden||0)});
      renderFotos(g); $('editor').scrollIntoView({behavior:'smooth'});
    }).catch(function(e){ say('Error: '+e.message); });
  }
  function renderFotos(g){
    var box=$('fotos'); box.innerHTML='';
    g.fotos.forEach(function(f){
      var d=document.createElement('div'); d.className='thumb';
      var im=document.createElement('img'); im.src=pubUrl(f.path); im.alt=''; d.appendChild(im);
      if(g.portada_path===f.path){ var t=document.createElement('span'); t.className='cover-tag'; t.textContent='PORTADA'; d.appendChild(t); }
      var acts=document.createElement('div'); acts.className='acts';
      var pc=document.createElement('button'); pc.textContent='Portada';
      pc.onclick=function(){ setCover(g,f.path); };
      var del=document.createElement('button'); del.className='danger'; del.textContent='Quitar';
      del.onclick=function(){ removePhoto(g,f); };
      acts.appendChild(pc); acts.appendChild(del); d.appendChild(acts);
      box.appendChild(d);
    });
    if(!g.fotos.length) box.innerHTML='<p class="muted">Sin fotos todavía.</p>';
  }

  /* watermark in the browser: small text, bottom-right */
  function watermark(file){
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){
        var s=Math.min(1,1400/Math.max(img.width,img.height));
        var w=Math.round(img.width*s), h=Math.round(img.height*s);
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        var x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
        var size=Math.max(18,Math.round(w/34)); x.font='700 '+size+'px Inter, Arial, sans-serif';
        var t='HADES PHOTO', tw=x.measureText(t).width, m=Math.round(w*0.03);
        x.fillStyle='rgba(0,0,0,.45)'; x.fillText(t,w-tw-m+1,h-m+1);
        x.fillStyle='rgba(255,255,255,.85)'; x.fillText(t,w-tw-m,h-m);
        c.toBlob(function(b){URL.revokeObjectURL(url); b?res(b):rej(new Error('No se pudo procesar la imagen'))},'image/jpeg',0.86);
      };
      img.onerror=function(){ rej(new Error('No se pudo leer '+file.name)); };
      img.src=url;
    });
  }
  function upload(path,blob){
    return fetch(U+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:headers({'Content-Type':'image/jpeg','x-upsert':'true'}),body:blob})
      .then(function(r){ if(!r.ok) return r.text().then(function(t){throw new Error('Subida: '+r.status+' '+t)}); });
  }
  function storageRemove(paths){
    return fetch(U+'/storage/v1/object/'+BUCKET,{method:'DELETE',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({prefixes:paths})});
  }
  function stamp(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  $('ePhotos').onchange=async function(){
    var files=Array.prototype.slice.call(this.files); this.value=''; if(!files.length||!current) return;
    try{
      for(var i=0;i<files.length;i++){
        say('Subiendo '+(i+1)+' de '+files.length+'…');
        var blob=await watermark(files[i]);
        var path=current+'/'+stamp()+'.jpg';
        await upload(path,blob);
        await api('POST','fotos',{galeria_id:current,path:path,orden:Date.now()%1000000});
      }
      say('Fotos subidas.'); await openEditor(current); loadList();
    }catch(e){ say('Error al subir: '+e.message); }
  };
  $('ePortada').onchange=async function(){
    var f=this.files[0]; this.value=''; if(!f||!current) return;
    try{
      say('Subiendo portada…');
      var blob=await watermark(f); var path=current+'/portada-'+stamp()+'.jpg';
      await upload(path,blob);
      await api('PATCH','galerias?id=eq.'+current,{portada_path:path});
      say('Portada actualizada.'); await openEditor(current); loadList();
    }catch(e){ say('Error: '+e.message); }
  };
  function setCover(g,path){
    api('PATCH','galerias?id=eq.'+current,{portada_path:path}).then(function(){ say('Portada elegida.'); return openEditor(current); }).then(loadList).catch(function(e){ say('Error: '+e.message); });
  }
  function removePhoto(g,f){
    if(!confirm('¿Quitar esta foto de la galería?')) return;
    api('DELETE','fotos?id=eq.'+f.id).then(function(){
      if(g.portada_path===f.path) return api('PATCH','galerias?id=eq.'+current,{portada_path:null});
    }).then(function(){ return storageRemove([f.path]); })
      .then(function(){ say('Foto quitada.'); return openEditor(current); }).then(loadList)
      .catch(function(e){ say('Error: '+e.message); });
  }

  $('eTitulo').onchange=function(){ var v=this.value.trim(); if(!v||!current) return;
    api('PATCH','galerias?id=eq.'+current,{titulo:v}).then(function(){ say('Nombre guardado.'); return loadList(); }).catch(function(e){ say('Error: '+e.message); }); };
  $('eFecha').onchange=function(){ if(!current) return;
    api('PATCH','galerias?id=eq.'+current,{fecha:this.value||null}).then(function(){ say('Fecha guardada.'); return loadList(); }).catch(function(e){ say('Error: '+e.message); }); };

  $('btnDelGal').onclick=async function(){
    if(!current) return;
    var g=galerias.find(function(x){return x.id===current});
    if(!confirm('¿Eliminar la galería "'+(g?g.titulo:'')+'" y todas sus fotos?')) return;
    try{
      var rows=await api('GET','fotos?galeria_id=eq.'+current+'&select=path');
      var paths=rows.map(function(r){return r.path});
      await api('DELETE','galerias?id=eq.'+current);
      if(paths.length) await storageRemove(paths);
      current=null; $('editor').classList.add('hidden'); say('Galería eliminada.'); loadList();
    }catch(e){ say('Error al eliminar: '+e.message); }
  };
  $('btnClose').onclick=function(){ $('editor').classList.add('hidden'); current=null; };
})();
</script></body></html>
